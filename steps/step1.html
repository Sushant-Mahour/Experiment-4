<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Determination of Shrinkage Temperature</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Raleway&display=swap" rel="stylesheet">
</head>
<body>
    <div class="simulation-container">
        <h1 class="title">Virtual Experiment: Shrinkage Temperature</h1>
        <p class="instruction-text">
            <span class="step-badge">Step 1</span>
            Prepare Specimen: Cut two specimens along the lines of toughness.
        </p>
        <div class="sim-area" id="step1">
            <img id="staticImg1" src="../assets/slide_1a_first.png" class="media-layer">
            <img id="gif1" class="media-layer" style="display: none;">
            
            <div id="interactionLayer1">
                <div class="transbox" id="transbox1" title="Click to Cut!"></div>
                <img src="../assets/arrow_down.gif" class="arrow" id="arrow1">
            </div>
        </div>
        <div class="toolbar">
            <button class="btn-nav btn-prev" id="prevToStep0">◀ Back</button>
            <div class="progress-bar" aria-hidden="true"><div class="progress-fill" style="width:11%"></div></div>
            <button class="btn-nav btn-next" id="nextToStep1b">Next ▶</button>
        </div>
    </div>
    <script src="step1.js"></script>
</body>
</html>
