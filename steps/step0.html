<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Determination of Shrinkage Temperature</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Raleway&display=swap" rel="stylesheet">
</head>
<body>
    <main class="simulation-container" id="main">
        <h1 class="title">Virtual Experiment: Shrinkage Temperature</h1>
        
        <div class="sim-area" id="heroArea">
            <img src="../Step Front.gif" class="media-layer" alt="Apparatus">
        </div>

        <div class="info-panel">
            <div class="info-text-content">
                <h2>Objective</h2>
                <p>To determine the Shrinkage temperature of Leather.</p>
                <div class="op-spec">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    <span><strong>Apparatus Used:</strong> Magnetic Stirrer, Heating Mechanism, Low Friction Pulley, Weights, Distilled Water, Thermometer.</span>
                </div>
            </div>
            <button class="btn-start" id="startBtn" style="border:none; cursor:pointer;">▶ Start Experiment</button>
        </div>
    </main>

    <script src="step0.js"></script>
</body>
</html>
